name: andina-arquitecturas

services:
  clean-mongodb:
    image: mongo:8
    container_name: andina-clean-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: andina_seguros_clean
    ports: ["27020:27017"]
    volumes: ["clean_mongo_data:/data/db"]
    networks: ["clean_network"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

  clean-backend:
    image: andina-seguros-clean:1.0.0
    container_name: andina-clean-backend
    build: { context: ./Arquitectura-Clean, dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://clean-mongodb:27017/andina_seguros_clean
      # Desde la fase 2 los tokens los emite identity-service, que este compose reducido no
      # incluye: aqui solo responden las rutas publicas (health, swagger). Para el sistema
      # completo usar Arquitectura-Clean/docker-compose.yml.
      JWT_JWKS_URI: http://identity-service:8080/.well-known/jwks.json
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8083:8080"]
    networks: ["clean_network"]
    depends_on:
      clean-mongodb: { condition: service_healthy }

volumes:
  clean_mongo_data: { name: andina_clean_mongo_data }

networks:
  clean_network: { name: andina_clean_network }
