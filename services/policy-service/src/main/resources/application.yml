server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: policy-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  data:
    mongodb:
      # Base propia policy_db con usuario propio. Replica set para que la poliza y su evento del
      # Outbox se guarden en una sola transaccion.
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/policy_db}
      auto-index-creation: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:andina}
    password: ${SPRING_RABBITMQ_PASSWORD:andina-local}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        # Fase 7: un mensaje sin confirmar por réplica. Así "cola sin mensajes listos" + "ninguno en
        # proceso" (SiniestrosEnProceso) significa que claim_ref ya aplicó todo lo recibido.
        prefetch: 1
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  rabbitmq:
    events-exchange: ${RABBITMQ_EVENTS_EXCHANGE:andina.events}
    dead-letter-exchange: ${RABBITMQ_EVENTS_DLX:andina.events.dlx}
    quote:
      queue: ${RABBITMQ_QUOTE_QUEUE:policy.quote.events}
      dead-letter-queue: ${RABBITMQ_QUOTE_DLQ:policy.quote.events.dlq}
    claim:
      queue: ${RABBITMQ_CLAIM_QUEUE:policy.claim.events}
      dead-letter-queue: ${RABBITMQ_CLAIM_DLQ:policy.claim.events.dlq}
  outbox:
    # Pasos 6.6 y 6.7: false mientras el monolito emita las polizas (ver OutboxConfig).
    publish-enabled: ${POLICY_EVENTS_PUBLISH_ENABLED:true}
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
  # Fase 7: al generar una póliza renovada se confirman los siniestros con claims-service (CP).
  claims-service:
    url: ${CLAIMS_SERVICE_URL:http://claims-service:8080}
    timeout: ${CLAIMS_SERVICE_TIMEOUT:2s}
  jwt:
    jwks-uri: ${JWT_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:andina-identity}

# Fase 7 (tabla 6.2 de la propuesta): policy -> claims con timeout de 2 s, un reintento (GET) y
# circuit breaker. Solo las caídas de claims-service cuentan y se reintentan.
resilience4j:
  circuitbreaker:
    instances:
      claims:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${CLAIMS_CB_WAIT_OPEN:30s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.andinaseguros.policy.interfaceadapters.out.siniestros.ClaimsServiceHistorialAdapter$ClaimsServiceCaido
  retry:
    instances:
      claims:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - com.andinaseguros.policy.interfaceadapters.out.siniestros.ClaimsServiceHistorialAdapter$ClaimsServiceCaido

springdoc:
  # Swagger y el contrato OpenAPI solo en desarrollo (SWAGGER_ENABLED=true en Compose).
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,mongo,rabbit
        liveness:
          include: livenessState
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  metrics:
    tags:
      application: policy-service
