server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: quotation-service
  lifecycle:
    timeout-per-shutdown-phase: 15s
  data:
    mongodb:
      # Base propia quotation_db con usuario propio. Replica set para que la cotizacion aceptada y
      # su quote.accepted.v1 del Outbox se guarden en una sola transaccion.
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/quotation_db}
      auto-index-creation: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:andina}
    password: ${SPRING_RABBITMQ_PASSWORD:andina-local}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  # Fase 7 (retiro del monolito): siembra las tablas tarifarias demo si no existen.
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
  rabbitmq:
    events-exchange: ${RABBITMQ_EVENTS_EXCHANGE:andina.events}
    dead-letter-exchange: ${RABBITMQ_EVENTS_DLX:andina.events.dlx}
    customer:
      queue: ${RABBITMQ_CUSTOMER_QUEUE:quotation.customer.events}
      dead-letter-queue: ${RABBITMQ_CUSTOMER_DLQ:quotation.customer.events.dlq}
    policy:
      queue: ${RABBITMQ_POLICY_QUEUE:quotation.policy.events}
      dead-letter-queue: ${RABBITMQ_POLICY_DLQ:quotation.policy.events.dlq}
  outbox:
    # Paso 5.4: false mientras las cotizaciones sigan en el monolito (ver OutboxConfig).
    publish-enabled: ${QUOTATION_EVENTS_PUBLISH_ENABLED:true}
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
  jwt:
    jwks-uri: ${JWT_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:andina-identity}
  customer-service:
    # Lectura de refuerzo (paso 5.3), solo si el dato no esta en las proyecciones.
    url: ${CUSTOMER_SERVICE_URL:http://customer-service:8080}
    timeout: ${CUSTOMER_SERVICE_TIMEOUT:2s}

# Paso 5.3 (tabla 6.2 de la propuesta): quotation -> customer con timeout de 2 s, un reintento en
# GET y circuit breaker. Solo las caidas de customer-service cuentan y se reintentan.
resilience4j:
  circuitbreaker:
    instances:
      customer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: ${CUSTOMER_CB_WAIT_OPEN:30s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.backendseguros.quotation.interfaceadapters.out.cliente.CustomerServiceDirectorioAdapter$CustomerServiceCaido
  retry:
    instances:
      customer:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - com.backendseguros.quotation.interfaceadapters.out.cliente.CustomerServiceDirectorioAdapter$CustomerServiceCaido

springdoc:
  # Swagger y el contrato OpenAPI solo en desarrollo (SWAGGER_ENABLED=true en Compose).
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,mongo,rabbit
        liveness:
          include: livenessState
  health:
    circuitbreakers:
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  metrics:
    tags:
      application: quotation-service
