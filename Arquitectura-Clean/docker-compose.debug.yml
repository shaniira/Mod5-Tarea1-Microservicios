# Solo para depurar en local: publica en el host los puertos que el stack normal mantiene cerrados.
#
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
#
# No usar fuera de la máquina de desarrollo (paso 0.6 de la ruta: MongoDB, RabbitMQ y los servicios
# solo son accesibles dentro de Docker).
services:
  mongodb:
    # Conexión desde el host (Compass): mongodb://root:<clave>@localhost:27020/?directConnection=true
    ports: ["27020:27017"]
  rabbitmq:
    ports: ["5672:5672", "15672:15672"]
  backend:
    ports: ["8083:8080"]
