server:
  port: ${SERVER_PORT:8080}
spring:
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:andina}
    password: ${SPRING_RABBITMQ_PASSWORD:andina-local}
    publisher-confirm-type: correlated
    publisher-returns: true
  data:
    mongodb:
      uri: mongodb://mongodb:27017/andina_seguros
      auto-index-creation: true
app:
  rabbitmq:
    # Exchange heredado: policy.issued.v1 sigue saliendo aqui para no romper a sus consumidores.
    exchange: ${RABBITMQ_EXCHANGE:andina.insurance.events}
    # Exchange objetivo de la migracion (seccion 4 de la propuesta): eventos nuevos (customer.*).
    events-exchange: ${RABBITMQ_EVENTS_EXCHANGE:andina.events}
    routing-key: ${RABBITMQ_ROUTING_KEY:policy.issued.v1}
    audit-queue: ${RABBITMQ_AUDIT_QUEUE:andina.policy.audit.queue}
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    confirm-timeout-ms: ${OUTBOX_CONFIRM_TIMEOUT_MS:5000}
  jwt:
    # Fase 2: los tokens los firma identity-service (RS256); aqui solo se verifican con su JWKS.
    jwks-uri: ${JWT_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:andina-identity}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  notification:
    adapter: whatsapp
  whatsapp:
    base-url: https://api.whatsapp.json.pe
    token: ${WHATSAPP_TOKEN:}
    timeout-seconds: 5
  vehicle-information:
    adapter: jsonpe
  jsonpe:
    base-url: https://api.json.pe
    token: ${JSONPE_TOKEN:}
    timeout-seconds: 5
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: andina-seguros-clean
logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
  level:
    com.andinaseguros.interfaceadapters.out.event: DEBUG
    com.andinaseguros.interfaceadapters.out.external.jsonpe: INFO

