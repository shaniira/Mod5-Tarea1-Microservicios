# CI del backend (paso 0.14 de la ruta): compila, corre las pruebas (incluye ArchUnit y las reglas
# de acceso por rol) y construye la imagen. Solo se ejecuta si cambia el backend o los contratos.
name: backend

on:
  push:
    paths:
      - "Arquitectura-Clean/**"
      - "contracts/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "Arquitectura-Clean/**"
      - "contracts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Arquitectura-Clean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas y ArchUnit
        run: mvn -B --no-transfer-progress verify
      - name: Imagen Docker
        run: docker build -t andina-seguros-clean:${{ github.sha }} .
