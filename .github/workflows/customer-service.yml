# CI de customer-service (plantilla del microservicio, paso 16): compila, corre las pruebas y
# las reglas ArchUnit, y construye la imagen. Solo se ejecuta si cambia el servicio o sus contratos.
name: customer-service

on:
  push:
    paths:
      - "services/customer-service/**"
      - "contracts/**"
      - ".github/workflows/customer-service.yml"
  pull_request:
    paths:
      - "services/customer-service/**"
      - "contracts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/customer-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas y ArchUnit
        run: mvn -B --no-transfer-progress verify
        # Fase 7 (paso 7.6): las pruebas de contrato contra contracts/ son obligatorias en CI.
        env:
          CONTRATOS_OBLIGATORIOS: "true"
      - name: Imagen Docker
        run: docker build -t customer-service:${{ github.sha }} .
