# CI del API Gateway: compila, corre las pruebas y construye la imagen. La prueba de contexto
# necesita Redis (rate limiter), por eso se levanta como servicio del job.
name: gateway

on:
  push:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway.yml"
  pull_request:
    paths:
      - "gateway/**"

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas
        run: mvn -B --no-transfer-progress verify
      - name: Imagen Docker
        run: docker build -t api-gateway:${{ github.sha }} .
