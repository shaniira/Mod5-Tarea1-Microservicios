apiVersion: v1
kind: ConfigMap
metadata:
  name: quotation-config
  namespace: backend-seguros
data:
  SERVER_PORT: "8080"
  SPRING_RABBITMQ_HOST: "rabbitmq-service.backend-seguros.svc.cluster.local"
  SPRING_RABBITMQ_PORT: "5672"
  JWT_JWKS_URI: "http://identity-service.backend-seguros.svc.cluster.local:8080/.well-known/jwks.json"
  JWT_ISSUER: "andina-identity"
  CUSTOMER_SERVICE_URL: "http://customer-service.backend-seguros.svc.cluster.local:8080"
  # Paso 5.4: el servicio es la fuente de sus eventos desde el corte.
  QUOTATION_EVENTS_PUBLISH_ENABLED: "true"
