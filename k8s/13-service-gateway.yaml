apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: backend-seguros
  labels:
    app: api-gateway
spec:
  type: ClusterIP # solo el Ingress lo alcanza; nada se publica directo al exterior
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
