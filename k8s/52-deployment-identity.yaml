# identity-service (fase 2). Sin estado en memoria (state OAuth, tickets y desafios MFA viven en
# Redis), por eso corre con 2 replicas desde el inicio (paso 2.10).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: andina-seguros
  labels:
    app: identity-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # usuario "spring" de la imagen
        fsGroup: 1001
      containers:
        - name: identity-service
          image: andina-identity-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: identity-config }
            - secretRef: { name: identity-secrets }
          volumeMounts:
            - name: jwt-key
              mountPath: /run/keys/identity
              readOnly: true
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "640Mi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            timeoutSeconds: 5
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            # Depende de Mongo, Redis y RabbitMQ (ver application.yml del servicio).
            httpGet: { path: /actuator/health/readiness, port: http }
            timeoutSeconds: 5
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            timeoutSeconds: 5
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: jwt-key
          secret:
            secretName: identity-jwt-key
            defaultMode: 0400
      terminationGracePeriodSeconds: 20
