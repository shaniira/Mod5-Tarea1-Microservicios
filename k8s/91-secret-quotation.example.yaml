# EJEMPLO — sin credenciales reales. Crear el real por linea de comandos:
#
#   kubectl create secret generic quotation-secrets --namespace andina-seguros #     --from-literal=SPRING_DATA_MONGODB_URI="mongodb://quotation:<clave>@mongodb-service.andina-seguros.svc.cluster.local:27017/quotation_db?replicaSet=rs0&authSource=quotation_db" #     --from-literal=SPRING_RABBITMQ_USERNAME="andina" #     --from-literal=SPRING_RABBITMQ_PASSWORD="..."
#
# El archivo real (sin sufijo .example) no se versiona (ver .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: quotation-secrets
  namespace: andina-seguros
type: Opaque
stringData:
  # Usuario propio con readWrite solo sobre quotation_db (ver 33-secret-mongodb.example.yaml).
  SPRING_DATA_MONGODB_URI: "mongodb://quotation:REEMPLAZAR@mongodb-service.andina-seguros.svc.cluster.local:27017/quotation_db?replicaSet=rs0&authSource=quotation_db"
  SPRING_RABBITMQ_USERNAME: "andina"
  SPRING_RABBITMQ_PASSWORD: "REEMPLAZAR"
