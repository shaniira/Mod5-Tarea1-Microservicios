# Redis solo para lo que dice la propuesta de migracion: rate limiting del gateway y estado
# efimero. No es una base de datos de negocio (no lleva PVC a proposito).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: andina-seguros
  labels: { app: redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            timeoutSeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: andina-seguros
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
