# EJEMPLO — sin credenciales reales. Crear el real por linea de comandos, p.ej.:
#
#   kubectl create secret generic backend-secrets --namespace andina-seguros \
#     --from-literal=FACEBOOK_APP_SECRET="..." \
#     --from-literal=FACEBOOK_TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=SPRING_RABBITMQ_USERNAME="andina" \
#     --from-literal=SPRING_RABBITMQ_PASSWORD="..."
#
# JWT_SECRET NO va aqui: el backend reutiliza el Secret compartido `andina-jwt-secret`
# (10-secret-jwt.example.yaml) para poder validar el mismo HS256 que firma el gateway.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: andina-seguros
type: Opaque
stringData:
  FACEBOOK_APP_SECRET: "REEMPLAZAR"
  FACEBOOK_TOKEN_ENCRYPTION_KEY: "REEMPLAZAR-32-bytes-base64"
  SPRING_RABBITMQ_USERNAME: "andina"
  SPRING_RABBITMQ_PASSWORD: "REEMPLAZAR"
  JSONPE_TOKEN: "REEMPLAZAR"
  WHATSAPP_TOKEN: "REEMPLAZAR"
