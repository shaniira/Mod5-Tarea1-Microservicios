# EJEMPLO — sin credenciales reales. Crear el real por linea de comandos, p.ej.:
#
#   kubectl create secret generic backend-secrets --namespace andina-seguros \
#     --from-literal=SPRING_RABBITMQ_USERNAME="andina" \
#     --from-literal=SPRING_RABBITMQ_PASSWORD="..." \
#     --from-literal=JSONPE_TOKEN="..." \
#     --from-literal=WHATSAPP_TOKEN="..."
#
# Desde la fase 2 el backend no tiene secretos de JWT ni de Facebook: los tokens los firma
# identity-service (ver 51-secret-identity.example.yaml) y aqui solo se verifican con la clave
# publica.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: andina-seguros
type: Opaque
stringData:
  # Usuario propio con readWrite solo sobre andina_seguros_clean (ver 33-secret-mongodb.example.yaml).
  SPRING_DATA_MONGODB_URI: "mongodb://andina:REEMPLAZAR@mongodb-service.andina-seguros.svc.cluster.local:27017/andina_seguros_clean?replicaSet=rs0&authSource=andina_seguros_clean"
  SPRING_RABBITMQ_USERNAME: "andina"
  SPRING_RABBITMQ_PASSWORD: "REEMPLAZAR"
  JSONPE_TOKEN: "REEMPLAZAR"
  WHATSAPP_TOKEN: "REEMPLAZAR"
