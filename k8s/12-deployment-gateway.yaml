apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: backend-seguros
  labels:
    app: api-gateway
spec:
  replicas: 2 # minimo 2 replicas en ambientes no locales (regla de HPA/escalado del gateway)
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0 # nunca menos replicas que las pedidas durante el despliegue
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "750m"
              memory: "512Mi"
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            timeoutSeconds: 5 # el 1s por defecto de Kubernetes se quedaba corto bajo CPU
            # limitada (mismo problema real encontrado y corregido en rabbitmq/mongodb)
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            timeoutSeconds: 5
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            timeoutSeconds: 5
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
      terminationGracePeriodSeconds: 20 # coincide con spring.lifecycle.timeout-per-shutdown-phase
