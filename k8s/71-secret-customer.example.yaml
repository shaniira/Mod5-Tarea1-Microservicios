# EJEMPLO — sin credenciales reales. Crear el real por linea de comandos:
#
#   kubectl create secret generic customer-secrets --namespace andina-seguros \
#     --from-literal=SPRING_DATA_MONGODB_URI="mongodb://customer:<clave>@mongodb-service.andina-seguros.svc.cluster.local:27017/customer_db?replicaSet=rs0&authSource=customer_db" \
#     --from-literal=JSONPE_TOKEN="..." \
#     --from-literal=SPRING_RABBITMQ_USERNAME="andina" \
#     --from-literal=SPRING_RABBITMQ_PASSWORD="..."
#
# El archivo real (sin sufijo .example) no se versiona (ver .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: customer-secrets
  namespace: andina-seguros
type: Opaque
stringData:
  # Usuario propio con readWrite solo sobre customer_db (ver 33-secret-mongodb.example.yaml).
  SPRING_DATA_MONGODB_URI: "mongodb://customer:REEMPLAZAR@mongodb-service.andina-seguros.svc.cluster.local:27017/customer_db?replicaSet=rs0&authSource=customer_db"
  JSONPE_TOKEN: "REEMPLAZAR"
  SPRING_RABBITMQ_USERNAME: "andina"
  SPRING_RABBITMQ_PASSWORD: "REEMPLAZAR"
