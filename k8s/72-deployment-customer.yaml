# customer-service (fase 3). Una replica para la demo; desde la fase 7 el relay del Outbox usa un
# lease (outbox_lock) y admite varias. La cache de placas vive en Redis, no en memoria.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: andina-seguros
  labels:
    app: customer-service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001 # usuario "spring" de la imagen
        fsGroup: 1001
      containers:
        - name: customer-service
          image: customer-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: customer-config }
            - secretRef: { name: customer-secrets }
          resources:
            requests: { cpu: "250m", memory: "384Mi" }
            limits: { cpu: "1", memory: "640Mi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            timeoutSeconds: 5
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            # Depende de Mongo y RabbitMQ; Redis no (si cae, la cache se comporta como vacia).
            httpGet: { path: /actuator/health/readiness, port: http }
            timeoutSeconds: 5
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            timeoutSeconds: 5
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
      terminationGracePeriodSeconds: 20
