apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: andina-seguros
  labels:
    app: backend
spec:
  replicas: 1 # el estado en memoria (OAuth, tickets, MFA) se fue a identity-service en la fase
  # 2, pero el relay del Outbox esta pensado para una sola replica (ver OutboxRelay). Subir a 2+
  # cuando el relay reclame los eventos antes de enviarlos.
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          image: andina-seguros-clean:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "1", memory: "768Mi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            timeoutSeconds: 5 # el 1s por defecto de Kubernetes se quedaba corto bajo CPU
            # limitada (mismo problema real encontrado y corregido en rabbitmq/mongodb)
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            timeoutSeconds: 5
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            timeoutSeconds: 5
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
      terminationGracePeriodSeconds: 20
