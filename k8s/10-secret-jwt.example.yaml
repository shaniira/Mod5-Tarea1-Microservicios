# EJEMPLO — sin credenciales reales. Copiar como 10-secret-jwt.yaml y reemplazar el valor,
# o crearlo por linea de comandos (recomendado, evita que el valor real quede en un archivo):
#
#   kubectl create secret generic andina-jwt-secret \
#     --namespace andina-seguros \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
#
# Este Secret lo consumen TANTO api-gateway COMO backend: en la fase 0 ambos validan el mismo
# JWT HS256 con el mismo secreto compartido (ver justificacion en
# gateway/src/main/java/com/andinaseguros/gateway/security/JwtValidator.java). Nunca se
# versiona con datos reales: este archivo *.example.yaml si se commitea a Git; el real
# (10-secret-jwt.yaml, sin sufijo .example) va en .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: andina-jwt-secret
  namespace: andina-seguros
type: Opaque
stringData:
  JWT_SECRET: "REEMPLAZAR-por-un-valor-aleatorio-de-al-menos-32-bytes"
