apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: andina-seguros
data:
  SERVER_PORT: "8080"
  SPRING_DATA_MONGODB_URI: "mongodb://mongodb-service.andina-seguros.svc.cluster.local:27017/andina_seguros_clean"
  SPRING_RABBITMQ_HOST: "rabbitmq-service.andina-seguros.svc.cluster.local"
  SPRING_RABBITMQ_PORT: "5672"
  CORS_ALLOWED_ORIGINS: "https://andina-seguros.example.com"
  # Fase 2: el backend ya no emite tokens ni tiene login; verifica los JWT RS256 de
  # identity-service con su clave publica. La configuracion de Google y Facebook paso a
  # 50-configmap-identity.yaml.
  JWT_JWKS_URI: "http://identity-service.andina-seguros.svc.cluster.local:8080/.well-known/jwks.json"
  JWT_ISSUER: "andina-identity"
