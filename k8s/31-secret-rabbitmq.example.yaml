# EJEMPLO — sin credenciales reales. Crear el real por linea de comandos (recomendado):
#   kubectl create secret generic rabbitmq-secrets --namespace andina-seguros \
#     --from-literal=RABBITMQ_DEFAULT_USER=andina \
#     --from-literal=RABBITMQ_DEFAULT_PASS="$(openssl rand -base64 24)"
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secrets
  namespace: andina-seguros
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "andina"
  RABBITMQ_DEFAULT_PASS: "REEMPLAZAR"
