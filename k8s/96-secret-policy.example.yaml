# EJEMPLO — sin credenciales reales. Crear el real por linea de comandos:
#
#   kubectl create secret generic policy-secrets --namespace backend-seguros #     --from-literal=SPRING_DATA_MONGODB_URI="mongodb://policy:<clave>@mongodb-service.backend-seguros.svc.cluster.local:27017/policy_db?replicaSet=rs0&authSource=policy_db" #     --from-literal=SPRING_RABBITMQ_USERNAME="andina" #     --from-literal=SPRING_RABBITMQ_PASSWORD="..."
#
# El archivo real (sin sufijo .example) no se versiona (ver .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: policy-secrets
  namespace: backend-seguros
type: Opaque
stringData:
  # Usuario propio con readWrite solo sobre policy_db (ver 33-secret-mongodb.example.yaml).
  SPRING_DATA_MONGODB_URI: "mongodb://policy:REEMPLAZAR@mongodb-service.backend-seguros.svc.cluster.local:27017/policy_db?replicaSet=rs0&authSource=policy_db"
  SPRING_RABBITMQ_USERNAME: "andina"
  SPRING_RABBITMQ_PASSWORD: "REEMPLAZAR"
