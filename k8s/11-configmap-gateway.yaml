apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: andina-seguros
data:
  SERVER_PORT: "8080"
  # Service DNS de Kubernetes: "<service>.<namespace>.svc.cluster.local" o, dentro del mismo
  # namespace, simplemente "<service>". Nunca una IP de Pod (los Pods son efimeros).
  BACKEND_SERVICE_URL: "http://backend-service.andina-seguros.svc.cluster.local:8080"
  REDIS_HOST: "redis-service.andina-seguros.svc.cluster.local"
  REDIS_PORT: "6379"
  CORS_ALLOWED_ORIGINS: "https://andina-seguros.example.com"
