apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: backend-seguros
data:
  SERVER_PORT: "8080"
  # Service DNS de Kubernetes: "<service>.<namespace>.svc.cluster.local" o, dentro del mismo
  # namespace, simplemente "<service>". Nunca una IP de Pod (los Pods son efimeros).
  REDIS_HOST: "redis-service.backend-seguros.svc.cluster.local"
  REDIS_PORT: "6379"
  CORS_ALLOWED_ORIGINS: "https://backend-seguros.example.com"
  # Fase 2: autenticacion en identity-service; el gateway valida los JWT con su clave publica
  # (no necesita ningun secreto).
  IDENTITY_SERVICE_URL: "http://identity-service.backend-seguros.svc.cluster.local:8080"
  JWT_JWKS_URI: "http://identity-service.backend-seguros.svc.cluster.local:8080/.well-known/jwks.json"
  JWT_ISSUER: "andina-identity"
  # Corte de las fases 3 a 6: el negocio va a los microservicios. "Mi cuenta" compone
  # customer-service y policy-service. Sin backend: el monolito se retiró.
  CUSTOMER_SERVICE_URL: "http://customer-service.backend-seguros.svc.cluster.local:8080"
  CLAIMS_SERVICE_URL: "http://claims-service.backend-seguros.svc.cluster.local:8080"
  QUOTATION_SERVICE_URL: "http://quotation-service.backend-seguros.svc.cluster.local:8080"
  POLICY_SERVICE_URL: "http://policy-service.backend-seguros.svc.cluster.local:8080"
