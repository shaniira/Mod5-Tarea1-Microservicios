# EJEMPLO — sin credenciales reales. Crear el real por linea de comandos:
#
#   kubectl create secret generic mongodb-secrets --namespace andina-seguros \
#     --from-literal=MONGO_ROOT_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MONGO_APP_USERS="andina:andina_seguros_clean:<clave1>,identity:identity_db:<clave2>,notification:notification_db:<clave3>"
#
# Cada servicio recibe solo su propio usuario (readWrite sobre su base) en su Secret:
# backend-secrets, identity-secrets y notification-secrets (SPRING_DATA_MONGODB_URI).
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secrets
  namespace: andina-seguros
type: Opaque
stringData:
  MONGO_ROOT_PASSWORD: "REEMPLAZAR"
  MONGO_APP_USERS: "andina:andina_seguros_clean:REEMPLAZAR,identity:identity_db:REEMPLAZAR,notification:notification_db:REEMPLAZAR"
