# EJEMPLO — sin credenciales reales. Crear el real por linea de comandos:
#
#   kubectl create secret generic mongodb-secrets --namespace andina-seguros \
#     --from-literal=MONGO_ROOT_PASSWORD="$(openssl rand -base64 24)" \
#     --from-literal=MONGO_APP_USERS="andina:andina_seguros_clean:<clave1>,identity:identity_db:<clave2>,notification:notification_db:<clave3>,customer:customer_db:<clave4>,claims:claims_db:<clave5>,quotation:quotation_db:<clave6>,policy:policy_db:<clave7>"
#
# Cada servicio recibe solo su propio usuario (readWrite sobre su base) en su Secret:
# backend-, identity-, notification-, customer-, claims-, quotation- y policy-secrets (SPRING_DATA_MONGODB_URI).
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secrets
  namespace: andina-seguros
type: Opaque
stringData:
  MONGO_ROOT_PASSWORD: "REEMPLAZAR"
  MONGO_APP_USERS: "andina:andina_seguros_clean:REEMPLAZAR,identity:identity_db:REEMPLAZAR,notification:notification_db:REEMPLAZAR,customer:customer_db:REEMPLAZAR,claims:claims_db:REEMPLAZAR,quotation:quotation_db:REEMPLAZAR,policy:policy_db:REEMPLAZAR"
