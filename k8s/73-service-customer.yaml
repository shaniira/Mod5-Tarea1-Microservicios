# ClusterIP: solo lo alcanza el gateway (/api/clientes/**, /api/vehiculos/** tras el corte). No se
# expone por el Ingress directamente.
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: andina-seguros
spec:
  selector: { app: customer-service }
  ports: [{ name: http, port: 8080, targetPort: http }]
