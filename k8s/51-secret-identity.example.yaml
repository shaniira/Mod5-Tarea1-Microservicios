# EJEMPLO — sin credenciales reales. Los Secrets reales se crean por linea de comandos:
#
# 1) Clave privada RS256 de los JWT. Solo la monta identity-service; nadie mas la necesita
#    (gateway y backend verifican con la clave publica del JWKS):
#
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem
#   kubectl create secret generic identity-jwt-key --namespace andina-seguros \
#     --from-file=private.pem=private.pem
#   rm private.pem
#
# 2) Secretos de los proveedores de login y de RabbitMQ:
#
#   kubectl create secret generic identity-secrets --namespace andina-seguros \
#     --from-literal=FACEBOOK_APP_SECRET="..." \
#     --from-literal=FACEBOOK_TOKEN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=SPRING_RABBITMQ_USERNAME="andina" \
#     --from-literal=SPRING_RABBITMQ_PASSWORD="..."
#
# El archivo real (sin sufijo .example) no se versiona (ver .gitignore).
apiVersion: v1
kind: Secret
metadata:
  name: identity-secrets
  namespace: andina-seguros
type: Opaque
stringData:
  FACEBOOK_APP_SECRET: "REEMPLAZAR"
  FACEBOOK_TOKEN_ENCRYPTION_KEY: "REEMPLAZAR-32-bytes-base64"
  SPRING_RABBITMQ_USERNAME: "andina"
  SPRING_RABBITMQ_PASSWORD: "REEMPLAZAR"
