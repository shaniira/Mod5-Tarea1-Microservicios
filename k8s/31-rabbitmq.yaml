# Requiere el Secret `rabbitmq-secrets` (ver 31-secret-rabbitmq.example.yaml) ya creado en el
# namespace antes de aplicar este archivo.
#
# Fase 7: StatefulSet con volumen persistente (antes Deployment con emptyDir). RabbitMQ guarda su
# estado en /var/lib/rabbitmq/mnesia/rabbit@<hostname>: con un StatefulSet el Pod se llama siempre
# rabbitmq-0, así que el nodo conserva colas y mensajes al reiniciarse (con emptyDir y un nombre de
# Pod aleatorio se perdían). Mismo defecto que se corrigió en Compose con "hostname: rabbitmq".
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins
  namespace: andina-seguros
data:
  # shovel: reproceso de DLQ (infra/rabbitmq/reprocesar-dlq.sh); prometheus: métricas por cola.
  enabled_plugins: "[rabbitmq_management,rabbitmq_prometheus,rabbitmq_shovel,rabbitmq_shovel_management]."
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: andina-seguros
  labels: { app: rabbitmq }
spec:
  serviceName: rabbitmq-service
  replicas: 1 # un solo nodo: el clúster de RabbitMQ (quorum queues) queda documentado como evolución
  selector: { matchLabels: { app: rabbitmq } }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
            - { name: prometheus, containerPort: 15692 }
          envFrom:
            - secretRef: { name: rabbitmq-secrets }
          volumeMounts:
            - { name: rabbitmq-data, mountPath: /var/lib/rabbitmq }
            - { name: plugins, mountPath: /etc/rabbitmq/enabled_plugins, subPath: enabled_plugins }
          # rabbitmq-diagnostics arranca su propio nodo Erlang de corta vida para preguntarle
          # al principal: bajo carga (o en un host de desarrollo con CPU limitada) tarda mas
          # de 1s, el timeout por defecto de Kubernetes. Sin timeoutSeconds explicito, el
          # liveness probe mata al contenedor justo cuando termina de arrancar (verificado:
          # "Liveness probe failed: command timed out... after 1s" con el valor por defecto).
          startupProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            timeoutSeconds: 10
            periodSeconds: 5
            failureThreshold: 24 # hasta 120s para el primer arranque
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            timeoutSeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            timeoutSeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: plugins
          configMap: { name: rabbitmq-plugins }
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
  namespace: andina-seguros
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management } # solo accesible dentro del cluster (kubectl port-forward)
    - { name: prometheus, port: 15692, targetPort: prometheus }
