# EJEMPLO — sin credenciales reales. Crear el real por linea de comandos:
#
#   kubectl create secret generic notification-secrets --namespace backend-seguros \
#     --from-literal=SPRING_DATA_MONGODB_URI="mongodb://notification:<clave>@mongodb-service.backend-seguros.svc.cluster.local:27017/notification_db?replicaSet=rs0&authSource=notification_db" \
#     --from-literal=SPRING_RABBITMQ_USERNAME="andina" \
#     --from-literal=SPRING_RABBITMQ_PASSWORD="..." \
#     --from-literal=WHATSAPP_TOKEN="..."
apiVersion: v1
kind: Secret
metadata:
  name: notification-secrets
  namespace: backend-seguros
type: Opaque
stringData:
  # Usuario propio con readWrite solo sobre notification_db: sin acceso a la base del backend.
  SPRING_DATA_MONGODB_URI: "mongodb://notification:REEMPLAZAR@mongodb-service.backend-seguros.svc.cluster.local:27017/notification_db?replicaSet=rs0&authSource=notification_db"
  SPRING_RABBITMQ_USERNAME: "andina"
  SPRING_RABBITMQ_PASSWORD: "REEMPLAZAR"
  WHATSAPP_TOKEN: "REEMPLAZAR"
