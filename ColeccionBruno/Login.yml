info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8082/api/auth/login
  body:
    type: json
    data: |-
      {
        "username": "admin",
        "password": "Admin123*"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Login exitoso", function () {
          expect(res.getStatus()).to.equal(200);
          expect(body.token).to.exist;
        });

        bru.setEnvVar("token", body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
