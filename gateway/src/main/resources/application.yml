server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 15s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cloud:
    gateway:
      # No metadata de negocio aqui: solo routing, resiliencia y CORS (edge service).
      httpclient:
        connect-timeout: 3000 # ms
        response-timeout: 5s
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers:
              - Authorization
              - Content-Type
              - Accept
              - X-Requested-With
              - Idempotency-Key
              - X-Correlation-Id
            exposed-headers: [Authorization, X-Correlation-Id]
            allow-credentials: true
            max-age: 3600
      # Los servicios detras del gateway (el backend todavia) tambien responden cabeceras CORS: sin
      # esto la respuesta llevaba Access-Control-Allow-Origin dos veces y el navegador la rechaza.
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Expose-Headers Vary, RETAIN_FIRST
      routes:
        # --- Rutas con rate limiting estricto (S9: fuerza bruta sobre login/MFA) ---
        - id: auth-login
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/auth/login
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: identityCB
                fallbackUri: forward:/fallback/identity

        - id: auth-mfa-verify
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/auth/mfa/verificar
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: identityCB
                fallbackUri: forward:/fallback/identity

        # --- Fase 2: identidad (login, Google, Facebook, MFA, perfil) en identity-service ---
        # Reversa: apuntar IDENTITY_SERVICE_URL de nuevo al backend.
        - id: identity
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/auth/**,/api/mfa/**
          metadata:
            response-timeout: 12000 # ms; ver identityCB
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: identityCB
                fallbackUri: forward:/fallback/identity

        # --- Resto del API del backend (catch-all de la fase 0) ---
        - id: backend
          uri: ${BACKEND_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/**,/swagger-ui/**,/swagger-ui.html,/v3/api-docs/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                redis-rate-limiter.requestedTokens: 1
            - name: CircuitBreaker
              args:
                name: backendCB
                fallbackUri: forward:/fallback/backend
            # Retry SOLO en GET (lecturas idempotentes). Nunca en POST/PATCH de negocio
            # (emitir poliza, registrar siniestro, etc.) sin una estrategia de idempotencia.
            - name: Retry
              args:
                retries: 1
                series: [SERVER_ERROR]
                methods: [GET]
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

resilience4j:
  circuitbreaker:
    instances:
      backendCB:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallDurationThreshold: 3s
        slowCallRateThreshold: 80
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      identityCB:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallDurationThreshold: 8s
        slowCallRateThreshold: 80
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  timelimiter:
    instances:
      backendCB:
        timeoutDuration: 3s
      # Mas amplio: el callback de Facebook hace hasta 3 llamadas a Facebook (5 s cada una).
      identityCB:
        timeoutDuration: 12s

app:
  security:
    # Fase 2: claves publicas de identity-service. El gateway ya no necesita un secreto para validar.
    jwks-uri: ${JWT_JWKS_URI:http://localhost:8084/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:andina-identity}
    # Base de Redis donde identity-service guarda la lista de revocacion (logout y usuarios
    # desactivados); el gateway solo la lee.
    revocation-redis-database: ${REVOCATION_REDIS_DATABASE:1}
    correlation-id-header: X-Correlation-Id
    # Mismas rutas publicas que Arquitectura-Clean/SecurityConfig.java: /api/auth/** (login,
    # register, google, facebook, mfa/verificar), swagger y el health del propio Gateway.
    public-paths:
      - /api/auth/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /actuator/**
      - /fallback/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [${spring.application.name}] %logger{36} - %msg%n"
  level:
    org.springframework.cloud.gateway: INFO
    gateway.access: INFO
