# Prometheus: lee /actuator/prometheus de cada servicio cada 15 s (sección 7.2 de la propuesta).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]

  # El backend se retiró en el paso 6.10: sin este job, la alerta ServicioCaido no lo reporta.

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8080"]

  # identity-service puede tener varias réplicas: el DNS de Docker devuelve una IP por réplica y
  # Prometheus mide cada una por separado.
  - job_name: identity-service
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["identity-service"]
        type: A
        port: 8080
        refresh_interval: 30s

  # Fases 3 a 6.
  - job_name: customer-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["customer-service:8080"]

  - job_name: claims-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["claims-service:8080"]

  - job_name: quotation-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["quotation-service:8080"]

  - job_name: policy-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["policy-service:8080"]

  # Mensajes por cola (plugin rabbitmq_prometheus). Solo la familia queue_coarse_metrics: da
  # rabbitmq_detailed_queue_messages{queue=...} sin medir todo el broker.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]

  # Fase 7 (paso 7.2): readiness de cada servicio (MongoDB, RabbitMQ y Redis alcanzables) vía el
  # blackbox exporter. probe_success = 0 dispara la alerta ServicioNoListo.
  - job_name: readiness
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway:8080/actuator/health/readiness
          - http://identity-service:8080/actuator/health/readiness
          - http://notification-service:8080/actuator/health/readiness
          - http://customer-service:8080/actuator/health/readiness
          - http://claims-service:8080/actuator/health/readiness
          - http://quotation-service:8080/actuator/health/readiness
          - http://policy-service:8080/actuator/health/readiness
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: "http://([^:]+):.*"
        target_label: servicio
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
