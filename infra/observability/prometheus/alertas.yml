# Alertas iniciales (sección 7.2 de la propuesta y README de notification-service). Se ven en
# Prometheus (Alerts) y en Grafana, y Alertmanager las envía por correo (alertmanager/alertmanager.yml).
groups:
  - name: andina-servicios
    rules:
      - alert: ServicioCaido
        expr: up == 0
        for: 1m
        labels: { severidad: critica }
        annotations:
          resumen: "{{ $labels.job }} ({{ $labels.instance }}) no responde a Prometheus"

      # Fase 7 (paso 7.2): el proceso responde pero no puede atender (MongoDB, RabbitMQ o Redis
      # inalcanzables). up == 0 cubre el proceso caído; esta, el servicio "vivo pero no listo".
      - alert: ServicioNoListo
        expr: probe_success{job="readiness"} == 0
        for: 1m
        labels: { severidad: critica }
        annotations:
          resumen: "{{ $labels.servicio }} no está listo (readiness): revisar su MongoDB, RabbitMQ o Redis"

      # Fase 7: sin /actuator. Readiness responde 503 cuando cae una dependencia y el blackbox lo
      # consulta: eso ya lo cubre ServicioNoListo, y aquí disparaba la alerta en todos los servicios.
      - alert: ErroresServidorAltos
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[5m]))
            / sum by (application) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.05
        for: 5m
        labels: { severidad: alta }
        annotations:
          resumen: "{{ $labels.application }}: más del 5 % de respuestas 5xx"

      # Fase 7: el gateway no puede refrescar su copia de revocaciones (Redis de identity caído).
      # Sigue atendiendo con la copia; lo revocado durante la caída no se conoce.
      - alert: CopiaRevocacionesAtrasada
        expr: gateway_revocaciones_copia_edad_seconds > 60
        for: 1m
        labels: { severidad: alta }
        annotations:
          resumen: "El gateway decide revocaciones con una copia de hace {{ $value }} s: revisar Redis"

      - alert: CircuitoAbierto
        expr: resilience4j_circuitbreaker_state{state=~"open|forced_open"} == 1
        for: 2m
        labels: { severidad: alta }
        annotations:
          resumen: "Circuit breaker {{ $labels.name }} abierto en {{ $labels.application }} hace más de 2 minutos"

  - name: andina-mensajeria
    rules:
      # Cada consumidor es dueño de su DLQ (*.dlq); la cantidad la mide RabbitMQ (job rabbitmq), así
      # que cubre a todos los servicios sin métricas propias.
      - alert: DlqConMensajes
        expr: max by (queue) (rabbitmq_detailed_queue_messages{queue=~".+[.]dlq"}) > 0
        for: 1m
        labels: { severidad: media }
        annotations:
          resumen: "La DLQ {{ $labels.queue }} tiene {{ $value }} mensaje(s): revisar y reprocesar"

      - alert: OutboxAtrasado
        expr: outbox_events_oldest_pending_age_seconds > 300
        for: 1m
        labels: { severidad: alta }
        annotations:
          resumen: "Hay eventos del Outbox sin publicar hace más de 5 minutos (¿RabbitMQ caído?)"

      - alert: NotificacionesPausadas
        expr: notification_listener_paused == 1
        for: 2m
        labels: { severidad: media }
        annotations:
          resumen: "El consumo de pólizas está pausado: WhatsApp no responde"
